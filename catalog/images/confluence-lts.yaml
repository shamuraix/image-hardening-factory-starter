apiVersion: image-hardening-factory/v1alpha1
kind: HardenedImage
metadata:
  name: confluence-lts
  track: release
  description: Hardened Confluence Data Center LTS image.
source:
  upstream: https://repo1.dso.mil/dsop/atlassian/confluence-data-center/confluence-lts.git
  mirrorPath: mirrors/repo1/atlassian/confluence-lts
  revision: 9fcf1b3eaf43f47dc06f7f87244644b797b2d608
  containerfile: Dockerfile
  hardeningManifest: hardening_manifest.yaml
  overlay: overlays/confluence-lts/patches
product:
  name: Confluence Data Center LTS
  version: 10.2.18
  vendor: Atlassian
  license: proprietary
build:
  platforms: [linux/amd64]
  network: internal-only
  base:
    kind: catalog
    image: ubi10-minimal
  rpm:
    source: private-mirror
  buildArgs:
    CONFLUENCE_VERSION: 10.2.18
policy:
  maximumDatabaseAgeHours: 72
  block:
    knownExploited: true
    critical: true
    fixableHigh: true
    newHigh: true
verify:
  profile: confluence
  sources:
    entrypoint: scripts/entrypoint.py
    helpers: scripts/entrypoint_helpers.py
    templates: scripts/config
  runUser: confluence
  runUid: 2002
  ports: [8090, 8091]
  entrypoint: [/usr/bin/tini, --]
  cmd: [/entrypoint.py]
  homeEnv: CONFLUENCE_HOME
  installDirEnv: CONFLUENCE_INSTALL_DIR
  requiredPaths: [/usr/bin/tini, /entrypoint.py, /entrypoint_helpers.py, /opt/atlassian/etc/confluence.cfg.xml.j2]
  forbiddenPaths: ["/opt/atlassian-confluence-*.tar.gz"]
publication:
  quarantineRepository: ${FACTORY_APPLICATION_QUARANTINE_REPOSITORY}
  releaseRepository: ${FACTORY_RELEASE_REPOSITORY}
  imagePath: atlassian/confluence-lts
