apiVersion: image-hardening-factory/v1alpha1
kind: HardenedImage
metadata:
  name: jira-lts
  track: release
  description: Hardened Jira and Jira Service Management Data Center LTS image.
source:
  upstream: https://repo1.dso.mil/dsop/atlassian/jira-data-center/jira-lts.git
  mirrorPath: mirrors/repo1/atlassian/jira-lts
  revision: 3df2bc1801cf6f9dd285f9cfd33203903f38741d
  containerfile: Dockerfile
  hardeningManifest: hardening_manifest.yaml
  overlay: overlays/jira-lts/patches
product:
  name: Jira Data Center LTS
  version: 11.3.11
  vendor: Atlassian
  license: proprietary
build:
  platforms: [linux/amd64]
  network: internal-only
  base:
    kind: catalog
    image: ubi10-minimal
  rpm:
    source: private-mirror
  buildArgs:
    JIRA_VERSION: 11.3.11
    JSM_VERSION: 11.3.11
policy:
  maximumDatabaseAgeHours: 72
  block:
    knownExploited: true
    critical: true
    fixableHigh: true
    newHigh: true
verify:
  profile: jira
  sources:
    entrypoint: scripts/entrypoint.py
    helpers: scripts/entrypoint_helpers.py
    templates: config
  runUser: jira
  runUid: 2001
  ports: [8080, 40001]
  entrypoint: [/usr/bin/tini, --]
  cmd: [/entrypoint.py]
  homeEnv: JIRA_HOME
  installDirEnv: JIRA_INSTALL_DIR
  requiredPaths: [/usr/bin/tini, /entrypoint.py, /entrypoint_helpers.py, /etc/container_id, /opt/atlassian/etc/server.xml.j2]
  forbiddenPaths: ["/opt/*.obr", /opt/jsm, "/opt/atlassian-jira-software-*.tar.gz"]
publication:
  quarantineRepository: ${FACTORY_APPLICATION_QUARANTINE_REPOSITORY}
  releaseRepository: ${FACTORY_RELEASE_REPOSITORY}
  imagePath: atlassian/jira-lts
