apiVersion: image-hardening-factory/v1alpha1
kind: HardenedImage
metadata:
  name: bitbucket-lts
  track: release
  description: Hardened Bitbucket Data Center LTS image.
source:
  upstream: https://repo1.dso.mil/dsop/atlassian/bitbucket-data-center/bitbucket-lts.git
  mirrorPath: mirrors/repo1/atlassian/bitbucket-lts
  revision: af750f62df2325dde68ea83ff64974c5a4d9cd75
  containerfile: Dockerfile
  hardeningManifest: hardening_manifest.yaml
  overlay: overlays/bitbucket-lts/patches
product:
  name: Bitbucket Data Center LTS
  version: 10.2.7
  vendor: Atlassian
  license: proprietary
build:
  platforms: [linux/amd64]
  network: internal-only
  base:
    kind: catalog
    image: ubi10-minimal
  rpm:
    source: private-mirror
  buildArgs:
    BITBUCKET_VERSION: 10.2.7
policy:
  maximumDatabaseAgeHours: 72
  block:
    knownExploited: true
    critical: true
    fixableHigh: true
    newHigh: true
verify:
  profile: bitbucket
  sources:
    entrypoint: scripts/entrypoint.py
    helpers: scripts/shared-components/image/entrypoint_helpers.py
  runUser: bitbucket
  runUid: 2003
  ports: [7990, 7999]
  entrypoint: [/usr/bin/tini, --]
  cmd: [/entrypoint.py]
  homeEnv: BITBUCKET_HOME
  installDirEnv: BITBUCKET_INSTALL_DIR
  requiredPaths: [/usr/bin/tini, /entrypoint.py, /entrypoint_helpers.py, /usr/bin/git]
  forbiddenPaths: ["/opt/atlassian-bitbucket-*.tar.gz", "/tmp/git-*"]
  envPaths: [JRE_HOME, JAVA_BINARY]
publication:
  quarantineRepository: ${FACTORY_APPLICATION_QUARANTINE_REPOSITORY}
  releaseRepository: ${FACTORY_RELEASE_REPOSITORY}
  imagePath: atlassian/bitbucket-lts
