workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "pipeline"

stages: [plan, execute]

variables:
  FACTORY_TOOLCHAIN_VERSION: "0.1.0"
  FACTORY_TOOLCHAIN_REGISTRY: "${FACTORY_TOOLCHAIN_REGISTRY:-registry.example.com/factory}"
  FACTORY_TOOLCHAIN_IMAGE: "${FACTORY_TOOLCHAIN_IMAGE:-factory-python}"
  FACTORY_RUNNER_IMAGE: "${FACTORY_RUNNER_IMAGE:-factory-runner}"
  FACTORY_FCS_RUNNER_IMAGE: "${FACTORY_FCS_RUNNER_IMAGE:-factory-fcs-runner}"
  FCS_CLI_VERSION: "${FCS_CLI_VERSION:-4.0.0}"
  FACTORY_CATALOG_DIR: "${FACTORY_CATALOG_DIR:-catalog/images}"
  FACTORY_ENABLE_VALIDATE: "${FACTORY_ENABLE_VALIDATE:-true}"
  FACTORY_ENABLE_PREPARE: "${FACTORY_ENABLE_PREPARE:-true}"
  FACTORY_ENABLE_BUILD: "${FACTORY_ENABLE_BUILD:-true}"
  FACTORY_ENABLE_SBOM: "${FACTORY_ENABLE_SBOM:-true}"
  FACTORY_ENABLE_SCAN: "${FACTORY_ENABLE_SCAN:-true}"
  FACTORY_ENABLE_FCS: "${FACTORY_ENABLE_FCS:-false}"
  FACTORY_ENABLE_COMPLIANCE: "${FACTORY_ENABLE_COMPLIANCE:-false}"
  FACTORY_ENABLE_TEST: "${FACTORY_ENABLE_TEST:-true}"
  FACTORY_ENABLE_GATE: "${FACTORY_ENABLE_GATE:-true}"
  FACTORY_ENABLE_REMEDIATE: "${FACTORY_ENABLE_REMEDIATE:-false}"
  FACTORY_ENABLE_IMPORT: "${FACTORY_ENABLE_IMPORT:-false}"
  FACTORY_ENABLE_ATTEST: "${FACTORY_ENABLE_ATTEST:-false}"
  FACTORY_ENABLE_PROMOTE: "${FACTORY_ENABLE_PROMOTE:-false}"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

render-child-pipeline:
  stage: plan
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/factory-python:${FACTORY_TOOLCHAIN_VERSION}
  script:
    - scripts/render_child_pipeline.sh generated-child.yml
  artifacts:
    paths: [generated-child.yml]
    expire_in: 7 days

execute-child-pipeline:
  stage: execute
  needs: [render-child-pipeline]
  trigger:
    include:
      - artifact: generated-child.yml
        job: render-child-pipeline
    strategy: depend
    forward:
      pipeline_variables: true
