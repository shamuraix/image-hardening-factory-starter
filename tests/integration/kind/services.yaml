apiVersion: v1
kind: Namespace
metadata:
  name: factory-harness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: factory-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      automountServiceAccountToken: false
      containers:
      - name: registry
        image: docker.io/library/registry@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
        env:
        - name: REGISTRY_AUTH
          value: htpasswd
        - name: REGISTRY_AUTH_HTPASSWD_REALM
          value: factory-harness
        - name: REGISTRY_AUTH_HTPASSWD_PATH
          value: /auth/htpasswd
        - name: REGISTRY_HTTP_TLS_CERTIFICATE
          value: /tls/ca.crt
        - name: REGISTRY_HTTP_TLS_KEY
          value: /tls/tls.key
        ports:
        - containerPort: 5000
        readinessProbe:
          tcpSocket:
            port: 5000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: auth
          mountPath: /auth
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: auth
        secret:
          secretName: registry-auth
      - name: tls
        secret:
          secretName: registry-tls
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: factory-harness
spec:
  type: NodePort
  selector:
    app: registry
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
