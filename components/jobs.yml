.factory-default:
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/${FACTORY_RUNNER_IMAGE}:${FACTORY_TOOLCHAIN_VERSION}
  tags: [factory-offline]
  interruptible: true
  variables:
    FACTORY_WORK_DIR: work/${FACTORY_IMAGE}
    HOME: /home/factory
    XDG_RUNTIME_DIR: /tmp/factory-runtime
    CONTAINERS_STORAGE_CONF: /home/factory/.config/containers/storage.conf
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: rootless
  before_script:
    - mkdir -p "${FACTORY_WORK_DIR}" "${XDG_RUNTIME_DIR}"
    - chmod 0700 "${XDG_RUNTIME_DIR}"

.factory-validate:
  extends: .factory-default
  stage: validate
  rules:
    - if: '$FACTORY_ENABLE_VALIDATE == "false" || $FACTORY_ENABLE_VALIDATE == "0" || $FACTORY_ENABLE_VALIDATE == "off"'
      when: never
    - when: on_success
  script:
    - factory validate --catalog catalog/images
    - scripts/validate_image.sh "${FACTORY_CATALOG_FILE}"
  artifacts:
    when: always
    paths: ["work/${FACTORY_IMAGE}/validation.json"]

.factory-prepare:
  extends: .factory-default
  stage: prepare
  rules:
    - if: '$FACTORY_ENABLE_PREPARE == "false" || $FACTORY_ENABLE_PREPARE == "0" || $FACTORY_ENABLE_PREPARE == "off"'
      when: never
    - when: on_success
  id_tokens:
    ARTIFACTORY_ID_TOKEN:
      aud: ${ARTIFACTORY_OIDC_AUDIENCE}
  script:
    - scripts/prepare_context.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    paths: ["work/${FACTORY_IMAGE}/context", "work/${FACTORY_IMAGE}/resource-lock.json", "work/${FACTORY_IMAGE}/resource-lock.sig", "work/${FACTORY_IMAGE}/build.env", "work/${FACTORY_IMAGE}/base.oci.tar"]
    expire_in: 7 days

.factory-build:
  extends: .factory-default
  stage: build
  rules:
    - if: '$FACTORY_ENABLE_BUILD == "false" || $FACTORY_ENABLE_BUILD == "0" || $FACTORY_ENABLE_BUILD == "off"'
      when: never
    - when: on_success
  tags: [factory-buildah-ephemeral]
  script:
    - scripts/build_image.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    paths: ["work/${FACTORY_IMAGE}/image.oci.tar", "work/${FACTORY_IMAGE}/image-metadata.json", "work/${FACTORY_IMAGE}/build.env"]
    expire_in: 7 days

.factory-sbom:
  extends: .factory-default
  stage: analyze
  rules:
    - if: '$FACTORY_ENABLE_SBOM == "false" || $FACTORY_ENABLE_SBOM == "0" || $FACTORY_ENABLE_SBOM == "off"'
      when: never
    - when: on_success
  script:
    - scripts/generate_sbom.sh "${FACTORY_WORK_DIR}/image.oci.tar" "${FACTORY_WORK_DIR}/evidence"
  artifacts:
    paths: ["work/${FACTORY_IMAGE}/evidence/sbom.*"]
    expire_in: 30 days

.factory-scan:
  extends: .factory-default
  stage: analyze
  rules:
    - if: '$FACTORY_ENABLE_SCAN == "false" || $FACTORY_ENABLE_SCAN == "0" || $FACTORY_ENABLE_SCAN == "off"'
      when: never
    - when: on_success
  script:
    - scripts/scan_image.sh "${FACTORY_WORK_DIR}"
  allow_failure: true
  artifacts:
    when: always
    paths: ["work/${FACTORY_IMAGE}/evidence/scans", "work/${FACTORY_IMAGE}/evidence/findings.json", "work/${FACTORY_IMAGE}/evidence/database-status.json"]
    expire_in: 30 days

# Default FCS runner image is factory-fcs-runner:${FCS_CLI_VERSION}; override via FACTORY_FCS_RUNNER_IMAGE.
.factory-fcs:
  extends: .factory-default
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/${FACTORY_FCS_RUNNER_IMAGE}:${FCS_CLI_VERSION}
  stage: analyze
  rules:
    - if: '$FACTORY_ENABLE_FCS == "false" || $FACTORY_ENABLE_FCS == "0" || $FACTORY_ENABLE_FCS == "off"'
      when: never
    - when: on_success
  tags: [factory-fcs-connected]
  environment:
    name: fcs/${FACTORY_RELEASE_ENV}
  script:
    - scripts/fcs_scan_image.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    when: always
    paths:
      - "work/${FACTORY_IMAGE}/evidence/scans/fcs"
    expire_in: 90 days

.factory-compliance:
  extends: .factory-default
  stage: compliance
  rules:
    - if: '$FACTORY_ENABLE_COMPLIANCE == "false" || $FACTORY_ENABLE_COMPLIANCE == "0" || $FACTORY_ENABLE_COMPLIANCE == "off"'
      when: never
    - when: on_success
  tags: [factory-fips-ephemeral]
  script:
    - scripts/compliance_scan.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    when: always
    paths: ["work/${FACTORY_IMAGE}/evidence/compliance"]
    expire_in: 30 days

.factory-test:
  extends: .factory-default
  stage: test
  rules:
    - if: '$FACTORY_ENABLE_TEST == "false" || $FACTORY_ENABLE_TEST == "0" || $FACTORY_ENABLE_TEST == "off"'
      when: never
    - when: on_success
  tags: [factory-test-ephemeral]
  script:
    - scripts/run_tests.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    when: always
    paths: ["work/${FACTORY_IMAGE}/evidence/tests"]
    expire_in: 30 days

.factory-gate:
  extends: .factory-default
  stage: policy
  rules:
    - if: '$FACTORY_ENABLE_GATE == "false" || $FACTORY_ENABLE_GATE == "0" || $FACTORY_ENABLE_GATE == "off"'
      when: never
    - when: on_success
  script:
    - scripts/evaluate_gate.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    when: always
    paths:
      - "work/${FACTORY_IMAGE}/evidence/gate-input.json"
      - "work/${FACTORY_IMAGE}/evidence/gate-result.json"
      - "work/${FACTORY_IMAGE}/evidence/findings.json"
      - "work/${FACTORY_IMAGE}/evidence/database-status.json"
    reports:
      dotenv: "work/${FACTORY_IMAGE}/gate.env"
    expire_in: 90 days

.factory-remediate:
  extends: .factory-default
  stage: policy
  rules:
    - if: '$FACTORY_ENABLE_REMEDIATE == "false" || $FACTORY_ENABLE_REMEDIATE == "0" || $FACTORY_ENABLE_REMEDIATE == "off"'
      when: never
    - when: manual
  tags: [factory-ai-untrusted]
  allow_failure: true
  script:
    - scripts/ai_remediation.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    when: always
    paths: ["work/${FACTORY_IMAGE}/evidence/remediation"]
    expire_in: 30 days

.factory-remediation-mr:
  extends: .factory-default
  stage: policy
  rules:
    - if: '$FACTORY_ENABLE_REMEDIATE == "false" || $FACTORY_ENABLE_REMEDIATE == "0" || $FACTORY_ENABLE_REMEDIATE == "off"'
      when: never
    - when: manual
  tags: [factory-remediation-broker]
  allow_failure: true
  script:
    - scripts/create_remediation_mr.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"

.factory-import:
  extends: .factory-default
  stage: import
  rules:
    - if: '$FACTORY_ENABLE_IMPORT == "false" || $FACTORY_ENABLE_IMPORT == "0" || $FACTORY_ENABLE_IMPORT == "off"'
      when: never
    - when: on_success
  tags: [factory-protected-importer]
  resource_group: import-${FACTORY_IMAGE}
  id_tokens:
    ARTIFACTORY_ID_TOKEN:
      aud: ${ARTIFACTORY_OIDC_AUDIENCE}
  script:
    - scripts/import_image.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    paths:
      - "work/${FACTORY_IMAGE}/import-result.json"
      - "work/${FACTORY_IMAGE}/image.oci.tar"
      - "work/${FACTORY_IMAGE}/image-metadata.json"
      - "work/${FACTORY_IMAGE}/resource-lock.json"
    reports:
      dotenv: "work/${FACTORY_IMAGE}/import.env"
    expire_in: 30 days

.factory-attest:
  extends: .factory-default
  stage: attest
  rules:
    - if: '$FACTORY_ENABLE_ATTEST == "false" || $FACTORY_ENABLE_ATTEST == "0" || $FACTORY_ENABLE_ATTEST == "off"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  tags: [factory-protected-signing]
  environment:
    name: signing/${FACTORY_RELEASE_ENV}
  id_tokens:
    ARTIFACTORY_ID_TOKEN:
      aud: ${ARTIFACTORY_OIDC_AUDIENCE}
  script:
    - scripts/sign_and_attest.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
  artifacts:
    paths: ["work/${FACTORY_IMAGE}/evidence/signing-result.json"]
    expire_in: 1 year

.factory-promote:
  extends: .factory-default
  stage: promote
  rules:
    - if: '$FACTORY_ENABLE_PROMOTE == "false" || $FACTORY_ENABLE_PROMOTE == "0" || $FACTORY_ENABLE_PROMOTE == "off"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  tags: [factory-protected-promotion]
  resource_group: promote-${FACTORY_RELEASE_ENV}-${FACTORY_IMAGE}
  script:
    - scripts/promote_image.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
