# Rootless BuildKit build. The run step needs user namespaces (newuidmap and
# newgidmap are setuid), so only that step relaxes allowPrivilegeEscalation and
# the seccomp/AppArmor profiles. The verify and seal steps stay fully
# restricted.
# No privileged mode, host paths, host networking, or engine sockets.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: factory-rootless-build
  labels:
    app.kubernetes.io/part-of: image-hardening-factory
    factory.dev/trust-class: buildkit
spec:
  params:
    - name: image
    - name: inputs
      type: array
      default: []
    - name: runner-image
    - name: commit
    - name: source-url
      default: ""
    - name: branch
      default: ""
    - name: change-id
      default: ""
  workspaces:
    - name: shared
  results:
    - name: seal
    - name: status
    - name: digest
      description: Candidate manifest digest recorded in image-metadata.json.
  volumes:
    - name: buildkit-tmp
      emptyDir:
        sizeLimit: 50Gi
  stepTemplate:
    image: $(params.runner-image)
    workingDir: $(workspaces.shared.path)/source
    envFrom:
      - configMapRef:
          name: factory-settings
    env:
      - {name: FACTORY_IMAGE, value: $(params.image)}
      - {name: FACTORY_COMMIT_SHA, value: $(params.commit)}
      - {name: FACTORY_SOURCE_URL, value: $(params.source-url)}
      - {name: FACTORY_BRANCH_NAME, value: $(params.branch)}
      - {name: FACTORY_CHANGE_ID, value: $(params.change-id)}
      - {name: FACTORY_PIPELINERUN, value: $(context.pipelineRun.name)}
      - {name: FACTORY_TASKRUN, value: $(context.taskRun.name)}
      - {name: FACTORY_NAMESPACE, value: $(context.pipelineRun.namespace)}
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
  steps:
    - name: verify
      args: ["$(params.inputs[*])"]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source scripts/tekton/env.sh
        scripts/tekton/artifacts.sh verify-source "${FACTORY_COMMIT_SHA}"
        scripts/tekton/artifacts.sh verify "$@"
    - name: run
      onError: continue
      computeResources:
        requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 10Gi}
        limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 60Gi}
      env:
        - name: ARTIFACTORY_READ_TOKEN
          valueFrom:
            secretKeyRef: {name: factory-artifactory-read, key: token}
        - name: FACTORY_RPM_MIRROR_USERNAME
          valueFrom:
            secretKeyRef: {name: factory-rpm-mirror, key: username}
        - name: FACTORY_RPM_MIRROR_PASSWORD
          valueFrom:
            secretKeyRef: {name: factory-rpm-mirror, key: password}
        - {name: FACTORY_BUILDKIT_NO_PROCESS_SANDBOX, value: "true"}
      volumeMounts:
        - {name: buildkit-tmp, mountPath: /tmp}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        privileged: false
        # Rootless BuildKit/Podman map the factory user's subordinate IDs through
        # the setuid newuidmap/newgidmap helpers. A setuid program receives only
        # the capabilities in the caller's bounding set, so that set must keep
        # CAP_SETUID and CAP_SETGID; the step process itself (uid 10001) still
        # has no effective capabilities, and the libcap-aware helpers built in
        # Containerfile.factory-runner keep exactly the one they need.
        allowPrivilegeEscalation: true
        capabilities:
          drop: [ALL]
          add: [SETUID, SETGID]
        # Nested containers mount their own /proc; needs the pod user namespace
        # (hostUsers: false, set by the rendered taskRunSpecs podTemplate).
        procMount: Unmasked
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source scripts/tekton/env.sh
        {
          scripts/runtime_preflight.sh "${FACTORY_WORK_DIR}/evidence/runtime"
          scripts/build_image.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
        } 2>&1 | tee "${FACTORY_WORK_DIR}/logs/build.log"
    - name: seal
      env:
        - {name: FACTORY_RUN_EXIT_CODE_PATH, value: $(steps.step-run.exitCode.path)}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source scripts/tekton/env.sh
        w=${FACTORY_WORK_DIR}
        scripts/tekton/artifacts.sh seal build "$(results.seal.path)" \
          "${w}/image.oci.tar" "${w}/image-metadata.json" "${w}/build.env" \
          "${w}/evidence/runtime/**" "${w}/logs/build.log"
        code=$(cat "${FACTORY_RUN_EXIT_CODE_PATH}")
        if [[ ${code} == 0 ]]; then
          jq -jer '.digest' "${w}/image-metadata.json" >"$(results.digest.path)"
          printf succeeded >"$(results.status.path)"
        else
          printf failed >"$(results.status.path)"
        fi
        exit "${code}"
