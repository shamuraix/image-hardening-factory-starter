# Rootless BuildKit build. The run step creates its own user namespace through
# newuidmap/newgidmap (file capabilities), so only that step relaxes
# allowPrivilegeEscalation and the seccomp/AppArmor profiles. The verify and
# seal steps stay fully restricted.
# No privileged mode, host paths, host networking, engine sockets, pod user
# namespace or unmasked /proc: BuildKit runs with --oci-worker-no-process-sandbox,
# which works on Kubernetes 1.28 with containerd 1.7.
# AppArmor is set to unconfined by the
# container.apparmor.security.beta.kubernetes.io/step-run annotation that the
# rendered PipelineRuns put on the build TaskRun (factory/tekton.py); the
# securityContext.appArmorProfile field does not exist before Kubernetes 1.30.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: factory-rootless-build
  labels:
    app.kubernetes.io/part-of: image-hardening-factory
    factory.dev/trust-class: buildkit
spec:
  params:
    - name: image
    - name: inputs
      type: array
      default: []
    - name: runner-image
    - name: pipelinerun
      description: >-
        Name of the owning PipelineRun. Tekton substitutes the pipelineRun
        context variables only inside a Pipeline, never inside a Task, so every
        Pipeline passes its own context.pipelineRun.name here; env.sh derives
        FACTORY_BUILD_ID from it.
    - name: commit
    - name: source-url
      default: ""
    - name: branch
      default: ""
    - name: change-id
      default: ""
  workspaces:
    - name: shared
  results:
    - name: seal
    - name: status
    - name: digest
      description: Candidate manifest digest recorded in image-metadata.json.
  volumes:
    - name: buildkit-tmp
      emptyDir:
        sizeLimit: 50Gi
  stepTemplate:
    image: $(params.runner-image)
    workingDir: $(workspaces.shared.path)/source
    envFrom:
      - configMapRef:
          name: factory-settings
    env:
      - {name: FACTORY_IMAGE, value: $(params.image)}
      - {name: FACTORY_COMMIT_SHA, value: $(params.commit)}
      - {name: FACTORY_SOURCE_URL, value: $(params.source-url)}
      - {name: FACTORY_BRANCH_NAME, value: $(params.branch)}
      - {name: FACTORY_CHANGE_ID, value: $(params.change-id)}
      - {name: FACTORY_PIPELINERUN, value: $(params.pipelinerun)}
      - {name: FACTORY_TASKRUN, value: $(context.taskRun.name)}
      - {name: FACTORY_NAMESPACE, value: $(context.taskRun.namespace)}
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
  steps:
    - name: verify
      args: ["$(params.inputs[*])"]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source scripts/tekton/env.sh
        scripts/tekton/artifacts.sh verify-source "${FACTORY_COMMIT_SHA}"
        scripts/tekton/artifacts.sh verify "$@"
    - name: run
      onError: continue
      computeResources:
        requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 10Gi}
        limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 60Gi}
      env:
        - name: ARTIFACTORY_READ_TOKEN
          valueFrom:
            secretKeyRef: {name: factory-artifactory-read, key: token}
        - name: FACTORY_RPM_MIRROR_USERNAME
          valueFrom:
            secretKeyRef: {name: factory-rpm-mirror, key: username}
        - name: FACTORY_RPM_MIRROR_PASSWORD
          valueFrom:
            secretKeyRef: {name: factory-rpm-mirror, key: password}
        - {name: FACTORY_BUILDKIT_NO_PROCESS_SANDBOX, value: "true"}
      volumeMounts:
        - {name: buildkit-tmp, mountPath: /tmp}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        privileged: false
        # Rootless BuildKit maps the factory user's subordinate IDs through
        # newuidmap/newgidmap, which carry the file capabilities cap_setuid and
        # cap_setgid. A file capability is granted only if it is in the caller's
        # bounding set and no_new_privs is unset, so the bounding set keeps
        # CAP_SETUID and CAP_SETGID and privilege escalation stays allowed; the
        # step process itself (uid 10001) still has no effective capabilities.
        allowPrivilegeEscalation: true
        capabilities:
          drop: [ALL]
          add: [SETUID, SETGID]
        # The runtime default profile blocks the unshare/mount calls RootlessKit
        # needs. A Localhost profile that allows them can replace Unconfined.
        seccompProfile:
          type: Unconfined
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source scripts/tekton/env.sh
        {
          scripts/runtime_preflight.sh "${FACTORY_WORK_DIR}/evidence/runtime"
          scripts/build_image.sh "${FACTORY_CATALOG_FILE}" "${FACTORY_WORK_DIR}"
        } 2>&1 | tee "${FACTORY_WORK_DIR}/logs/build.log"
    - name: seal
      env:
        - {name: FACTORY_RUN_EXIT_CODE_PATH, value: $(steps.step-run.exitCode.path)}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source scripts/tekton/env.sh
        w=${FACTORY_WORK_DIR}
        scripts/tekton/artifacts.sh seal build "$(results.seal.path)" \
          "${w}/image.oci.tar" "${w}/image-metadata.json" "${w}/build.env" \
          "${w}/evidence/runtime/**" "${w}/logs/build.log"
        code=$(cat "${FACTORY_RUN_EXIT_CODE_PATH}")
        if [[ ${code} == 0 ]]; then
          jq -jer '.digest' "${w}/image-metadata.json" >"$(results.digest.path)"
          printf succeeded >"$(results.status.path)"
        else
          printf failed >"$(results.status.path)"
        fi
        exit "${code}"
