# Do not edit by hand: tests/unit/test_tekton.py fails when this file drifts.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: jira-lts-on-push
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: '5'
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "push" && target_branch == "main" && (
          "catalog/images/jira-lts.yaml".pathChanged() ||
          "overlays/jira-lts/patches/**".pathChanged() ||
          "tests/profiles/jira/**".pathChanged() ||
          "tests/profiles/base/**".pathChanged() ||
          "scripts/**".pathChanged() ||
          "factory/**".pathChanged() ||
          "policies/**".pathChanged() ||
          ".tekton/pipelines/image-build.yaml".pathChanged() ||
          ".tekton/tasks/**".pathChanged())
  labels:
    app.kubernetes.io/part-of: image-hardening-factory
    factory.dev/image: jira-lts
    factory.dev/trigger: push
spec:
  pipelineRef:
    name: factory-image-build
  params:
  - name: image
    value: jira-lts
  - name: repo-url
    value: '{{ repo_url }}'
  - name: revision
    value: '{{ revision }}'
  - name: runner-image
    value: '{{ runner_image }}'
  - name: agent-image
    value: '{{ agent_image }}'
  - name: git-provider
    value: '{{ git_provider }}'
  - name: git-auth-secret
    value: '{{ git_auth_secret }}'
  - name: event-type
    value: push
  - name: branch
    value: main
  - name: scm-secret
    value: factory-scm-bot
  - name: publish
    value: 'true'
  - name: enable-agents
    value: 'true'
  - name: enable-remediation
    value: 'true'
  - name: enable-release-request
    value: 'true'
  taskRunTemplate:
    serviceAccountName: factory-pipeline
    podTemplate:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      automountServiceAccountToken: false
  taskRunSpecs:
  - pipelineTaskName: checkout
    serviceAccountName: factory-offline
  - pipelineTaskName: validate
    serviceAccountName: factory-offline
  - pipelineTaskName: prepare
    serviceAccountName: factory-reader
  - pipelineTaskName: build
    serviceAccountName: factory-buildkit
