      hostUsers: false
  - pipelineTaskName: sbom
    serviceAccountName: factory-offline
  - pipelineTaskName: scan
    serviceAccountName: factory-offline
  - pipelineTaskName: assessment
    serviceAccountName: factory-offline
  - pipelineTaskName: compliance
    serviceAccountName: factory-offline
    podTemplate:
      nodeSelector:
        factory.dev/fips-node: 'true'
      tolerations:
      - key: factory.dev/fips-node
        operator: Equal
        value: 'true'
        effect: NoSchedule
  - pipelineTaskName: test
    serviceAccountName: factory-test
    podTemplate:
      hostUsers: false
