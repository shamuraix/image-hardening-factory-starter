workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [snapshot, mirror, intake, publish-lock]

snapshot-ubi9-rpms:
  stage: snapshot
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/factory-intake:${FACTORY_TOOLCHAIN_VERSION}
  tags: [factory-connected-intake]
  script:
    - snapshot_id=$(scripts/snapshot_rpm_repo.sh "${UBI9_SOURCE_REPO_FILE}" rpm-ubi9-snapshot-local work/rpm-ubi9 "${UBI9_SOURCE_REPO_ID}" | tail -n1)
    - printf 'RPM_SNAPSHOT_UBI9_ID=%s\n' "${snapshot_id}" >ubi9-snapshot.env
  artifacts:
    reports:
      dotenv: ubi9-snapshot.env

snapshot-ubi10-rpms:
  stage: snapshot
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/factory-intake:${FACTORY_TOOLCHAIN_VERSION}
  tags: [factory-connected-intake]
  script:
    - snapshot_id=$(scripts/snapshot_rpm_repo.sh "${UBI10_SOURCE_REPO_FILE}" rpm-ubi10-snapshot-local work/rpm-ubi10 "${UBI10_SOURCE_REPO_ID}" | tail -n1)
    - printf 'RPM_SNAPSHOT_UBI10_ID=%s\n' "${snapshot_id}" >ubi10-snapshot.env
  artifacts:
    reports:
      dotenv: ubi10-snapshot.env

mirror-repo1-sources:
  stage: mirror
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/factory-intake:${FACTORY_TOOLCHAIN_VERSION}
  tags: [factory-connected-intake]
  script:
    - scripts/mirror_sources.sh

resolve-resource-locks:
  stage: intake
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/factory-intake:${FACTORY_TOOLCHAIN_VERSION}
  tags: [factory-connected-intake]
  parallel:
    matrix:
      - FACTORY_IMAGE: [ubi9-minimal, ubi10-minimal, bitbucket-lts, confluence-lts, jira-lts]
  script:
    - catalog="catalog/images/${FACTORY_IMAGE}.yaml"
    - mirror=$(yq -r '.source.mirrorPath' "${catalog}")
    - revision=$(yq -r '.source.revision' "${catalog}")
    - git clone --no-checkout "${INTERNAL_GIT_BASE_URL}/${mirror}.git" "work/${FACTORY_IMAGE}/source"
    - git -C "work/${FACTORY_IMAGE}/source" checkout --detach "${revision}"
    - factory intake --image "${catalog}" --source-dir "work/${FACTORY_IMAGE}/source" --cache-dir "work/${FACTORY_IMAGE}/cache" --output "work/${FACTORY_IMAGE}/resource-lock.json"
  artifacts:
    paths: ["work/${FACTORY_IMAGE}/resource-lock.json", "work/${FACTORY_IMAGE}/cache"]
    expire_in: 2 days

publish-resource-locks:
  stage: publish-lock
  image: ${FACTORY_TOOLCHAIN_REGISTRY}/factory-intake:${FACTORY_TOOLCHAIN_VERSION}
  tags: [factory-connected-intake]
  parallel:
    matrix:
      - FACTORY_IMAGE: [ubi9-minimal, ubi10-minimal, bitbucket-lts, confluence-lts, jira-lts]
  needs:
    - job: resolve-resource-locks
      parallel:
        matrix:
          - FACTORY_IMAGE: ['$[[ matrix.FACTORY_IMAGE ]]']
  script:
    - scripts/publish_intake.sh "${FACTORY_IMAGE}"
