# Local or single-node cluster profile for running the full pipeline against the
# real external GitLab and Artifactory. The cluster needs what production needs
# (docs/configuration.md): Kubernetes 1.28 or later with Tekton, Pipelines-as-Code,
# Chains, and ValidatingAdmissionPolicy enabled.
#
# Differences from a production environment, and nothing else:
#   - The NetworkPolicies are removed. A laptop usually cannot satisfy egress
#     pinned to fixed CIDRs; the trust boundaries that matter locally
#     (per-task ServiceAccounts, per-step secrets, the admission policy, sealed
#     evidence) are unchanged.
#   - Agents are switched off (Repository param enable_agents "false") because a
#     laptop usually has no LLM gateway. Drop this patch to use one.
#
# Include it from an environment's factory kustomization (see
# deploy/environments/dev).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # A unit test (tests/unit/test_deploy_overlays.py) checks the built output.
  - patch: |
      - op: replace
        path: /spec/params/4/value
        value: "false"
    target:
      kind: Repository
      name: image-hardening-factory
  - patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: placeholder
    target:
      kind: NetworkPolicy
