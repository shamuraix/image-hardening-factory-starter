# Every Secret the factory Tasks reference, with the keys they read. This file is
# documentation: do NOT apply it with real values. Create these with your secret
# manager in the image-factory namespace. Values are placeholders.
#
# Secret                          Keys                         Used by (pipeline task)
# factory-artifactory-read        token                        prepare, build, resolve, evidence-context
# factory-rpm-mirror              username, password           build (RPM mirror, read only)
# factory-intake-cosign-public-key cosign.pub                  prepare
# factory-artifactory-quarantine  token                        quarantine (default branch only)
# factory-artifactory-sign        token                        attest
# factory-artifactory-release     token                        promote
# factory-artifactory-pointer     token                        promote (release pointer for bases)
# factory-cosign-<env>            cosign.key, password, cosign.pub   attest / promote (commercial|gov1|gov2)
# factory-artifactory-intake      token                        intake, security-data
# factory-intake-cosign           cosign.key, password, cosign.pub   intake, security-data
# factory-scm-mirror              username, token              intake (mirror push)
# factory-scm-bot                 username, token              agent publish step (default branch only)
# factory-ai-gateway              token                        agent step (LLM gateway credential)
# factory-pac-incoming            secret                       Repository incoming webhook, schedules, dependents
# factory-gitlab-webhook          provider.token, webhook.secret   Pipelines-as-Code GitLab provider (Repository CR)
#
# The LLM gateway token is reachable by the agent process; scope it to model
# access only, rate-limit it, and rotate it like any shared CI credential.
apiVersion: v1
kind: Secret
metadata:
  name: factory-artifactory-read
type: Opaque
stringData:
  token: REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: factory-rpm-mirror
type: Opaque
stringData:
  username: REPLACE
  password: REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: factory-cosign-commercial
type: Opaque
stringData:
  cosign.key: REPLACE
  password: REPLACE
  cosign.pub: REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: factory-ai-gateway
type: Opaque
stringData:
  token: REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: factory-pac-incoming
type: Opaque
stringData:
  secret: REPLACE
---
apiVersion: v1
kind: Secret
metadata:
  name: factory-gitlab-webhook
type: Opaque
stringData:
  provider.token: REPLACE   # GitLab personal or project access token, scope api
  webhook.secret: REPLACE   # the webhook's secret token
