# Dev overlay: the local overlay (single-node cluster, no NetworkPolicies,
# agents off) pointed at the dev Artifactory repositories. Artifactory serves
# OCI images with the repository-path method, so every image reference is
# artifactory.cicd.dc/<repository key>/<path>; the factory's logical
# repositories are path prefixes inside the one docker repository, and the
# per-stage write scopes are Artifactory permission targets on those prefixes
# (docs/configuration.md, "Artifactory layout").
#
# Still required by hand: the runner image digests below (after pushing them),
# FACTORY_PAC_CONTROLLER_URL (the address GitLab can reach the controller at),
# the node label/taint for the compliance stage, and the Secrets from
# deploy/secrets.example.yaml.
# Apply with
#   kubectl apply -k deploy/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-factory
resources:
  - ../local
patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: factory-settings
      data:
        # GitLab: the factory project and the group that holds the source
        # mirrors intake pushes (one project per mirrored upstream repository).
        INTERNAL_GIT_BASE_URL: https://gitlab.cicd.dc/techops-cicd/cicd-federal/mirrors
        FACTORY_GITLAB_API_URL: https://gitlab.cicd.dc/api/v4
        ARTIFACTORY_URL: https://artifactory.cicd.dc
        ARTIFACTORY_REGISTRY: artifactory.cicd.dc
        ARTIFACTORY_USERNAME: techops-cicd-esd-hip-dev-bot
        # Generic repository: locks/, intake resources, releases/, security-data/
        FACTORY_SOURCE_REPOSITORY: techops-cicd-esd-hip-generic-dev-local/factory
        # Docker repository, one prefix per trust boundary
        UPSTREAM_OCI_REPOSITORY: techops-cicd-esd-hip-docker-dev-local/upstream
        FACTORY_BASE_QUARANTINE_REPOSITORY: techops-cicd-esd-hip-docker-dev-local/quarantine/bases
        FACTORY_APPLICATION_QUARANTINE_REPOSITORY: techops-cicd-esd-hip-docker-dev-local/quarantine/apps
        FACTORY_RELEASE_REPOSITORY: techops-cicd-esd-hip-docker-dev-local/release
        FACTORY_CANARY_REPOSITORY: techops-cicd-esd-hip-docker-dev-local/canary
        # RPM content: ext-redhat-ubi-remote is a remote repository in front of
        # https://cdn-ubi.redhat.com, so the CDN layout continues below this
        # root (ubi9/9/x86_64/baseos/os, ...). The catalog's build.rpm.source
        # (private-mirror) applies; Secret factory-rpm-mirror holds the bot
        # account and its token. techops-cicd-esd-hip-rpm-dev-local is not
        # used: a local rpm repository cannot mirror the CDN.
        FACTORY_UBI_MIRROR_URL: https://artifactory.cicd.dc/artifactory/ext-redhat-ubi-remote/content/public/ubi/dist
  # The GitLab project this Repository CR binds; Pipelines-as-Code matches the
  # webhook payload's project URL against spec.url exactly.
  - patch: |
      - op: replace
        path: /spec/url
        value: https://gitlab.cicd.dc/techops-cicd/cicd-federal/govcloud-image-hardening-factory
      - op: replace
        path: /spec/git_provider/url
        value: https://gitlab.cicd.dc
    target:
      kind: Repository
      name: image-hardening-factory
  # Runner images live under factory/ in the docker repository; pin the digests
  # printed when you push them (skopeo inspect --format '{{.Digest}}').
  - patch: |
      - op: replace
        path: /spec/params/0/value
        value: artifactory.cicd.dc/techops-cicd-esd-hip-docker-dev-local/factory/factory-runner@sha256:REPLACE
      - op: replace
        path: /spec/params/1/value
        value: artifactory.cicd.dc/techops-cicd-esd-hip-docker-dev-local/factory/factory-intake-runner@sha256:REPLACE
      - op: replace
        path: /spec/params/2/value
        value: artifactory.cicd.dc/techops-cicd-esd-hip-docker-dev-local/factory/factory-agent@sha256:REPLACE
    target:
      kind: Repository
      name: image-hardening-factory
