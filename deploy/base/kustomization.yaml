apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-factory
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - settings.yaml
  - repository.yaml
  - network-policies.yaml
  - schedules.yaml
  - admission-policy.yaml
# Secrets are deliberately not managed here. See ../secrets.example.yaml for the
# names and keys every Task expects, and create them with your secret manager
# (External Secrets, Sealed Secrets, Vault Agent, SOPS).
