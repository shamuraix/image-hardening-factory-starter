# Defence in depth for the most important PaC invariant: pods created for a
# merge-request or comment event never receive write, signing, release, mirror,
# SCM-bot, or incoming-webhook secrets. Checked on Pods, where Tekton has
# resolved every $(params...) secret name, so a parameterised secret cannot
# slip through.
#
# The rule is an allowlist, so it fails closed: protected secrets are permitted
# only when Pipelines-as-Code marked the run as a "push" or "incoming" event
# (merges to the default branch, release merges, CronJob and fan-out webhooks).
# Every other event type is refused: "pull_request" (GitHub), "Merge Request"
# (GitLab, see pkg/provider/gitlab/parse_payload.go in Pipelines-as-Code),
# "pull_request_labeled", comment-driven retests, and pods with no marker at all.
#
# Kubernetes 1.28 serves ValidatingAdmissionPolicy only as v1beta1, and only
# when the cluster enables it: kube-apiserver needs
#   --feature-gates=ValidatingAdmissionPolicy=true
#   --runtime-config=admissionregistration.k8s.io/v1beta1=true
# Without that, applying this file fails (no such resource), so the deploy
# stops instead of running without the guard. On 1.30 or later change both
# apiVersions to admissionregistration.k8s.io/v1. Tekton propagates
# PipelineRun labels/annotations (including Pipelines-as-Code's event-type) to
# TaskRuns and their pods; confirm with
#   kubectl get pod -l tekton.dev/pipelineRun -o jsonpath='{.items[0].metadata}'
apiVersion: admissionregistration.k8s.io/v1beta1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-factory-pr-secret-isolation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: tekton-task-pod
      expression: >-
        has(object.metadata.labels) && 'tekton.dev/pipelineRun' in object.metadata.labels
  variables:
    - name: eventType
      expression: >-
        has(object.metadata.annotations) &&
        'pipelinesascode.tekton.dev/event-type' in object.metadata.annotations
        ? object.metadata.annotations['pipelinesascode.tekton.dev/event-type']
        : ('pipelinesascode.tekton.dev/event-type' in object.metadata.labels
           ? object.metadata.labels['pipelinesascode.tekton.dev/event-type'] : 'none')
    # Only these event types may hold protected secrets. Both GitHub and GitLab
    # providers report merges as "push"; schedules and fan-out use "incoming".
    - name: trusted
      expression: variables.eventType in ['push', 'incoming']
    - name: protected
      expression: >-
        ['factory-artifactory-quarantine', 'factory-artifactory-sign',
         'factory-artifactory-release', 'factory-artifactory-pointer',
         'factory-artifactory-intake', 'factory-intake-cosign',
         'factory-cosign-commercial', 'factory-cosign-gov1', 'factory-cosign-gov2',
         'factory-scm-bot', 'factory-scm-mirror', 'factory-pac-incoming']
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.trusted ||
        !variables.containers.exists(c, has(c.env) && c.env.exists(e,
          has(e.valueFrom) && has(e.valueFrom.secretKeyRef) &&
          e.valueFrom.secretKeyRef.name in variables.protected))
      message: only push or incoming runs may reference protected secrets in env
    - expression: >-
        variables.trusted ||
        !variables.containers.exists(c, has(c.envFrom) && c.envFrom.exists(e,
          has(e.secretRef) && e.secretRef.name in variables.protected))
      message: only push or incoming runs may reference protected secrets in envFrom
    - expression: >-
        variables.trusted || !has(object.spec.volumes) ||
        !object.spec.volumes.exists(v, has(v.secret) && v.secret.secretName in variables.protected)
      message: only push or incoming runs may mount protected secrets
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-factory-pr-secret-isolation
spec:
  policyName: image-factory-pr-secret-isolation
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: image-factory
