# Non-secret settings shared by every environment, injected into every factory
# step with envFrom. Environment-specific keys (hosts, repositories, URLs, the
# bot identity, approvers) are added to this ConfigMap from the environment
# manifest, deploy/environments/<env>/manifest/environment.yaml, by
# deploy/components/environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-settings
data:
  FACTORY_CATALOG_DIR: catalog/images
  FACTORY_DEFAULT_BRANCH: main
  # Release governance
  FACTORY_POINTER_ENVIRONMENT: commercial
  # Upstream tracking (Repo One branch followed by intake and upstream-sync)
  FACTORY_UPSTREAM_BRANCH: development
  # Pipelines-as-Code Repository CR name (deploy/base/repository.yaml)
  FACTORY_PAC_REPOSITORY: image-hardening-factory
  FACTORY_AGENT_TIMEOUT: 1500s
