# Pipelines-as-Code has no cron trigger, so CronJobs call its incoming webhook.
# Each job runs an inline script (no repository code) with the incoming secret.
# Times are UTC; stagger them so builds do not contend for the same nodes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-schedules
data:
  trigger.sh: |
    #!/bin/sh
    set -eu
    for pipelinerun in "$@"; do
      printf 'url = "%s/incoming?repository=%s&branch=%s&pipelinerun=%s&secret=%s"\n' \
        "${FACTORY_PAC_CONTROLLER_URL%/}" "${FACTORY_PAC_REPOSITORY}" \
        "${FACTORY_DEFAULT_BRANCH:-main}" "${pipelinerun}" "${FACTORY_PAC_INCOMING_SECRET}" |
        curl --fail --silent --show-error --request POST --config - >/dev/null
      echo "triggered ${pipelinerun}"
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-rescan
spec:
  # Re-gate every pinned image against fresh vulnerability data well inside the
  # 72h database freshness window; a deny hands off to the remediation agent.
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {factory.dev/needs-pac: "true"}
        spec:
          serviceAccountName: factory-scheduler
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: trigger
              image: artifactory.internal.example/factory-tools/factory-runner@sha256:REPLACE
              command: ["/bin/sh", "/scripts/trigger.sh"]
              args: [bitbucket-lts-on-schedule, confluence-lts-on-schedule, jira-lts-on-schedule]
              envFrom:
                - configMapRef: {name: factory-settings}
              env:
                - name: FACTORY_PAC_INCOMING_SECRET
                  valueFrom:
                    secretKeyRef: {name: factory-pac-incoming, key: secret}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
          volumes:
            - name: scripts
              configMap: {name: factory-schedules}
---
