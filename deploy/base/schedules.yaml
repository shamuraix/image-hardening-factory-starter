apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-upstream-sync
spec:
  # Intake refreshes signed locks for the current pins; independently, the
  # upstream-sync agent looks for new Iron Bank commits and proposes rebased
  # overlays. When such a proposal merges, intake must run for the new pins
  # (the next scheduled run, or trigger intake-on-schedule manually).
  schedule: "7 5 * * 1-5"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {factory.dev/needs-pac: "true"}
        spec:
          serviceAccountName: factory-scheduler
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: trigger
              image: artifactory.internal.example/factory-tools/factory-runner@sha256:REPLACE
              command: ["/bin/sh", "/scripts/trigger.sh"]
              args: [intake-on-schedule, agent-upstream-sync-on-schedule]
              envFrom:
                - configMapRef: {name: factory-settings}
              env:
                - name: FACTORY_PAC_INCOMING_SECRET
                  valueFrom:
                    secretKeyRef: {name: factory-pac-incoming, key: secret}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
          volumes:
            - name: scripts
              configMap: {name: factory-schedules}
---
