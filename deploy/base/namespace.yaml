apiVersion: v1
kind: Namespace
metadata:
  name: image-factory
  labels:
    app.kubernetes.io/part-of: image-hardening-factory
    # Rootless BuildKit creates a user namespace through newuidmap/newgidmap
    # (file capabilities), which requires allowPrivilegeEscalation, the
    # SETUID/SETGID capabilities, and Unconfined seccomp/AppArmor on the single
    # build run step. Pod Security "baseline" forbids that, so enforcement is
    # privileged-level while warnings/audit report anything beyond
    # "restricted". The real limits are the Task securityContexts (no
    # privileged, no host namespaces or paths) and admission-policy.yaml.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
