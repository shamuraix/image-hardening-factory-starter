# One ServiceAccount per trust class (see factory/tekton.py BUILD/RELEASE/
# MAINTENANCE_SERVICE_ACCOUNTS). None needs Kubernetes API access, so tokens are
# never mounted. Bind image-pull secrets or workload identity per account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-pipeline
  labels: {factory.dev/trust-class: default}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-offline
  labels: {factory.dev/trust-class: offline}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-reader
  labels: {factory.dev/trust-class: internal-read}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-buildkit
  labels: {factory.dev/trust-class: buildkit}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-test
  labels: {factory.dev/trust-class: test}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-importer
  labels: {factory.dev/trust-class: import}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-signer
  labels: {factory.dev/trust-class: signing}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-promoter
  labels: {factory.dev/trust-class: promotion}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-intake
  labels: {factory.dev/trust-class: intake}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-agent
  labels: {factory.dev/trust-class: agent}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-scheduler
  labels: {factory.dev/trust-class: scheduler}
automountServiceAccountToken: false
