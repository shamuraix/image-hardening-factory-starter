# Rootless Podman defaults for the factory user. The runner is a Kubernetes
# step container: it has no /dev/net/tun, so pasta and slirp4netns (rootless
# Podman's network namespace helpers) cannot start. Containers therefore get
# no network namespace unless a script asks for one explicitly: the product
# tests pass --network none for one-shot checks and --network host (the
# step's own namespace, inside a pod the pod's) for the integration run.
[containers]
netns = "none"
