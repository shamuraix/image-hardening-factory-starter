[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-hardening-factory"
version = "0.1.0"
description = "Offline-first Tekton image hardening factory with Claude Code operations agents"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  # context-check renders the products' Jinja templates with the same
  # major.minor the image ships (UBI 10 python3-jinja2 3.1.6).
  "Jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools]
packages = ["factory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
factory = ["schemas/*.json"]
