[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-hardening-factory"
version = "0.1.0"
description = "Offline-first GitLab CI image hardening factory"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools]
packages = ["factory"]

[tool.ruff]
line-length = 100
target-version = "py311"
